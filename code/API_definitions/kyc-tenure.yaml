externalDocs:
  description: Product documentation at CAMARA
  url: https://github.com/camaraproject/Tenure

servers:
  - url: "{apiRoot}/kyc-tenure/vwip"
    variables:
      apiRoot:
        default: http://localhost:9091
        description: API root, defined by the service provider, e.g. `api.example.com` or `api.example.com/somepath`

tags:
  - name: Check Subscriber Tenure
    description: Check details about the length of tenure of the subscriber

paths:
  /check-tenure:
    post:
      tags:
        - Check Subscriber Tenure
      summary: The KYC Tenure service API
      description: |
        Verifies a specified length of tenure, based on a provided date, for a network subscriber to establish a level of trust for the network subscription identifier.

      security:
        - openId:
            - kyc-tenure:check-tenure

      operationId: checkTenure

      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Tenure"

      responses:
        "200":
          description: Respond with tenure information
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenureInfo"

        "400":
          $ref: '../common/CAMARA_common.yaml#/components/responses/BadRequestWithRange400'
        "401":
          $ref: '../common/CAMARA_common.yaml#/components/responses/Unauthenticated401'
        "403":
          $ref: '../common/CAMARA_common.yaml#/components/responses/PermissionDenied403'
        "404":
          $ref: '../common/CAMARA_common.yaml#/components/responses/IdentifierNotFound404'
        "422":
          $ref: '../common/CAMARA_common.yaml#/components/responses/PhoneNumberIdentifier422'
        "429":
          $ref: '../common/CAMARA_common.yaml#/components/responses/TooManyRequests429'

components:
  securitySchemes:
    openId:
      $ref: "../common/CAMARA_common.yaml#/components/securitySchemes/openId"

  schemas:
    Tenure:
      description: Specifies date from which continuous tenure of the identified mobile subscriber is required to be confirmed
      type: object
      properties:
        phoneNumber:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/PhoneNumber"
        tenureDate:
          type: string
          description: The date, in RFC 3339 / ISO 8601 compliant format "YYYY-MM-DD", from which continuous tenure of the identified network subscriber is required to be confirmed
          format: date
          minLength: 10
          maxLength: 10
          example: "2023-07-03"
      required:
        - tenureDate

    TenureInfo:
      type: object
      description: Defines tenure information provided in API response body
      properties:
        tenureDateCheck:
          description: |
            `true` when the identified mobile subscription has had valid tenure since `tenureDate`, otherwise `false`
          example: true
          type: boolean
        contractType:
          description: |
            If exists, populated with:
            - `PAYG` - prepaid (pay-as-you-go) account
            - `PAYM` - contract account
            - `Business` - Business (enterprise) account

            This attribute may be omitted from the response set if the information is not available
          example: "PAYM"
          type: string
          enum: ["PAYG", "PAYM", "Business"]
      required:
        - tenureDateCheck
